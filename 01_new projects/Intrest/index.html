<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interest Calculator</title>
</head>
<body>
    <div class="container">
        <h1>Interest Calculator</h1>
        <blockquote>
            I = P*R*T
        </blockquote>
        <p>&nbsp;</p>
        <label for="principal">Principal Amount (P):</label>
        <input type="number" id="principal" placeholder="Enter principal amount">
        <p>&nbsp;</p>
        <label for="rate">Annual Interest Rate (%):</label>
        <input type="number" id="rate" placeholder="Enter interest rate">
        <p>&nbsp;</p>
        <label for="time">Time (years):</label>
        <input type="number" id="time" placeholder="Enter time in years">
        <p>&nbsp;</p>
        <div id="result"></div>
    <script src="script.js"></script>
</body>
</html>
