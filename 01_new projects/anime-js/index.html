<body>
    <div id="box" style="background:#3498db; width:50px; height:50px;"></div>
<!-- v3 — the classic API, anime() works directly -->
<script src="../../00_Libarys/anime-master/dist/bundles/anime.esm.min.js"></script>
<script type="module">

  anime({
    targets: '#box',
    translateY: 500,
    translateX: 500,
    scale: 1.5,
    duration: 2000,
  borderRadius: ['0%', '50%'],
  backgroundColor: ['#e74c3c', '#2ecc71'],
  width: [80, 120],
  height: [80, 120],
  easing: 'easeInOutCubic',
  direction: 'alternate',
  loop: true
  });
  
</script>
