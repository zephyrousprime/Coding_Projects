    <h1 class="title">Enter in Your Classes Data</h1>
    <div class="from">
        <form id="class-form" action="insert.php" method="post" novalidate>
            <div class="form-row">
                <label for="class_input">Class name</label>
                <input type="text" name="class" id="class_input" required placeholder="Enter class name">
            </div>

            <fieldset class="year-group">
                <legend>Year level</legend>
                <label><input type="radio" name="year_level" value="7" required> 7</label>
                <label><input type="radio" name="year_level" value="8"> 8</label>
                <label><input type="radio" name="year_level" value="9"> 9</label>
                <label><input type="radio" name="year_level" value="10"> 10</label>
                <label><input type="radio" name="year_level" value="11"> 11</label>
                <label><input type="radio" name="year_level" value="12"> 12</label>
            </fieldset>

            <div class="form-row range-row">
                <label for="size">Class Size</label>
                <input type="range" name="size" id="size" min="1" max="30" value="15" required>
                <div id="size_output">Size: 15</div>
            </div>

            <div class="grades">
                <div class="grade-group">
                    <label for="lowest_grade">Lowest grade</label>
                    <select name="lowest_grade" id="lowest_grade" required>
                        <option value="" selected disabled>--Choose an option--</option>
                        <option value="A+">A+</option>
                        <option value="A">A</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B">B</option>
                        <option value="B-">B-</option>
                        <option value="C+">C+</option>
                        <option value="C">C</option>
                        <option value="C-">C-</option>
                        <option value="D+">D+</option>
                        <option value="D">D</option>
                        <option value="D-">D-</option>
                        <option value="E+">E+</option>
                        <option value="E">E</option>
                        <option value="E-">E-</option>
                        <option value="F">F</option>
                    </select>
                </div>
                <div class="grade-group">
                    <label for="av_grade">Average grade</label>
                    <select name="av_grade" id="av_grade" required>
                        <option value="" selected disabled>--Choose an option--</option>
                        <option value="A+">A+</option>
                        <option value="A">A</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B">B</option>
                        <option value="B-">B-</option>
                        <option value="C+">C+</option>
                        <option value="C">C</option>
                        <option value="C-">C-</option>
                        <option value="D+">D+</option>
                        <option value="D">D</option>
                        <option value="D-">D-</option>
                        <option value="E+">E+</option>
                        <option value="E">E</option>
                        <option value="E-">E-</option>
                        <option value="F">F</option>
                    </select>
                </div>
                <div class="grade-group">
                    <label for="highest_grade">Highest grade</label>
                    <select name="highest_grade" id="highest_grade" required>
                        <option value="" selected disabled>--Choose an option--</option>
                        <option value="A+">A+</option>
                        <option value="A">A</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B">B</option>
                        <option value="B-">B-</option>
                        <option value="C+">C+</option>
                        <option value="C">C</option>
                        <option value="C-">C-</option>
                        <option value="D+">D+</option>
                        <option value="D">D</option>
                        <option value="D-">D-</option>
                        <option value="E+">E+</option>
                        <option value="E">E</option>
                        <option value="E-">E-</option>
                        <option value="F">F</option>
                    </select>
                </div>
            </div>

            <div class="g-recaptcha" data-sitekey="6Ldcl_4sAAAAAF9QZhhfhZrFwn8yaNwIJN8elEVc"></div>

            <p id="form-validation-hint" class="form-validation-hint" role="status" aria-live="polite">Fill in all fields before submitting.</p>
            <button type="submit" class="submit-btn" id="submit-btn" >Submit</button>
        </form>
    </div>

    <div class="bacground">
        <pre class="mermaid"></pre>
    </div>
