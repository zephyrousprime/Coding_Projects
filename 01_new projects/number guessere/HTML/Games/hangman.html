<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Protest+Revolution&family=Protest+Riot&family=Protest+Strike&family=Protest+Guerrilla&family=Orbitron:wght@400;700;900&family=Montserrat:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Roboto+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
	<link rel="icon" href="../SVG's/Hangman.svg" type="image/svg+xml">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
	<link rel="stylesheet" href="../../CSS/style.css" />
	<title>Fractal Hangman</title>
</head>
<body>
	<header class="site-header">
		<div class="container header-inner">
			<a class="brand" href="../index.html"><i class="fas fa-brain"></i>The Nexus Hub</a>
			<nav class="main-nav">
				<a href="number.html"><i class="fas fa-compass"></i> Angle Guesser</a>
				<a href="rps.html"><i class="fas fa-atom"></i> Quantum RPS</a>
				<a href="tictactoe.html"><i class="fas fa-th"></i> Atomic Tic Tac Toe</a>
				<a href="../P5 Canvas/p5.html"><i class="fas fa-palette"></i> Cosmic Canvas</a>
				<a href="../P5 Canvas/p5_solor.html"><i class="fas fa-sun"></i> Nebula System</a>
				<a href="../P5 Canvas/p5_torus.html"><i class="fas fa-ring"></i> Void Torus</a>
			</nav>
		</div>
	</header>

	<main class="container">
		<section class="game" id="hangman-game">
			<h1>Fractal Hangman</h1>
			<p id="hangman-word" style="font-family:monospace; letter-spacing:8px;"></p>
			<p id="hangman-msg"></p>
			<p id="hangman-guessed"></p>
			<p id="hangman-attempts"></p>
			<div class="hangman-canvas-container">
				<img id="hangmanImages" src="Images/1.png" alt="Fractal drawing" />
			</div>
			<div class="controls">
    			<select id="hangman-category">
					<option value="abstract">Abstract Concepts</option>
					<option value="space">Space Terms</option>
					<option value="atoms">Atomic Elements</option>
    			</select>

    			<input id="hangman-input" type="text" maxlength="1" placeholder="Enter a letter" />
    			<button id="hangman-guess-btn">Guess</button>
    			<button id="hangman-reset-btn" class="secondary">Reset</button>
			</div>
		</section>
	</main>

	<footer class="site-footer"><div class="container">©The Nexus Hub </div></footer>

	<script src="JS/hangman.js"></script>
	<script src="../script.js"></script>
</body>
</html>
