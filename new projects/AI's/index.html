<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Multi-AI Question Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Ask once, read everywhere</h1>

  <form id="askForm">
    <textarea id="question" placeholder="Type your question…" required></textarea>
    <button type="submit">Send to all AIs</button>
  </form>

  <section id="results" class="grid"></section>

  <script src="script.js"></script>
</body>
</html>
