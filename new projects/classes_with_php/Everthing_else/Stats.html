
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="stats.svg">
    <title>Class Statistics</title>
 
    <!-- Tabulator -->
    <link href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator.min.css" rel="stylesheet">
    <script src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
 
    <!-- ApexCharts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
 
</head>
<body class="page-other">
    <nav class="site-nav" aria-label="Main">
        <ul>
            <li><a href="index.html"><img class="nav-icon" src="home.svg" alt="" width="24" height="24"><span>Home</span></a></li>
            <li><a href="Form.html"><img class="nav-icon" src="form.svg" alt="" width="24" height="24"><span>Form</span></a></li>
            <li><a href="Stats.html"><img class="nav-icon" src="stats.svg" alt="" width="24" height="24"><span>Stats</span></a></li>
        </ul>
    </nav>
 
    <h1 class="title">Class Statistics</h1>
 
    <main class="stats-page">
 
        <!-- Summary cards – filled by JS from PHP data -->
        <section class="stats-overview" aria-label="Summary">
            <div class="stat-card">
                <span class="stat-label">Total classes</span>
                <span class="stat-value" id="total-classes">–</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Average class size</span>
                <span class="stat-value" id="avg-size">–</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Year levels</span>
                <span class="stat-value" id="year-span">–</span>
            </div>
        </section>
 
        <!-- Tabulator table -->
        <section class="stats-table-wrap" aria-label="Class listings">
            <h2 class="stats-section-title">All classes</h2>
            <div id="class-table"><p class="loading-msg">Loading data…</p></div>
        </section>
 
        <!-- ApexCharts -->
        <section class="stats-charts" aria-label="Charts">
            <h2 class="stats-section-title">Charts</h2>
            <div class="charts-grid">
                <div class="chart-card">
                    <p class="chart-title">Class sizes</p>
                    <div id="chart-sizes"></div>
                </div>
                <div class="chart-card">
                    <p class="chart-title">Average grade distribution</p>
                    <div id="chart-grades"></div>
                </div>
                <div class="chart-card">
                    <p class="chart-title">Classes per year level</p>
                    <div id="chart-years"></div>
                </div>
                <div class="chart-card">
                    <p class="chart-title">Grade range per class (low → avg → high)</p>
                    <div id="chart-range"></div>
                </div>
            </div>
        </section>
    </main>
 
    <div class="bacground">
        <pre class="mermaid"></pre>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
