<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
    <script>
    function setup(){
        createCanvas(1000,1000);
   }

    draw = function() {
        
  background(30);

  // First cube
  push();
  translate(-150, 0, 0);
  rotateY(frameCount * 0.02);
  box(80);
  

  // Second cube
  
  translate(150, 0, 0);
  rotateX(frameCount * 0.02);
  sphere(80);
  
  translate(150, 0, 0);
  rotateX(frameCount * 0.02);
  sphere(80);
  translate(150, 0, 0);
  rotateX(frameCount * 0.02);
  sphere(80);
  translate(150, 0, 0);
  rotateX(frameCount * 0.02);
  sphere(80);
  translate(150, 0, 0);
  rotateX(frameCount * 0.02);
  sphere(80);
  translate(150, 0, 0);
  rotateX(frameCount * 0.02);
  sphere(80);
  translate(150, 0, 0);
  rotateX(frameCount * 0.02);
  sphere(80);
  translate(150, 0, 0);
  rotateX(frameCount * 0.02);
  sphere(80);
  translate(150, 0, 0);
  rotateX(frameCount * 0.02);
  sphere(80);
  translate(150, 0, 0);
  rotateX(frameCount * 0.02);
  sphere(80);
  translate(150, 0, 0);
  rotateX(frameCount * 0.02);
  sphere(80);
  translate(150, 0, 0);
  rotateX(frameCount * 0.02);
  sphere(80);
  translate(150, 0, 0);
  rotateX(frameCount * 0.02);
  sphere(80);  
  pop();
  orbitControl(10);
  directionalLight(255, 255, 255, 0, 0, -1);
  ambientLight(100);
    }
    </script>
</body>
</html>
