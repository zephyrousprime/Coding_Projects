<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Protest+Revolution&family=Protest+Riot&family=Protest+Strike&family=Protest+Guerrilla&family=Orbitron:wght@400;700;900&family=Montserrat:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Roboto+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
	<link rel="icon" href="../SVG's/Atomic_TTT.svg" type="image/svg+xml">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
	<link rel="stylesheet" href="../../CSS/style.css" />
	<title>Atomic Tic Tac Toe</title>
</head>
<body>
	<header class="site-header">
		<div class="container header-inner">
			<a class="brand" href="../index.html"><i class="fas fa-brain"></i>The Nexus Hub</a>
			<nav class="main-nav">
				<a href="number.html"><i class="fas fa-compass"></i> Angle Guesser</a>
				<a href="rps.html"><i class="fas fa-atom"></i> Quantum RPS</a>
				<a href="hangman.html"><i class="fas fa-puzzle-piece"></i> Fractal Hangman</a>
				<a href="../P5 Canvas/p5.html"><i class="fas fa-palette"></i> Cosmic Canvas</a>
				<a href="../P5 Canvas/p5_solor.html"><i class="fas fa-sun"></i> Nebula System</a>
				<a href="../P5 Canvas/p5_torus.html"><i class="fas fa-ring"></i> Void Torus</a>
			</nav>
		</div>
	</header>

	<main class="container">
		<section class="game" id="ttt-game">
			<h1>Atomic Tic Tac Toe</h1>
			
			<div class="ttt-grid" id="ttt-grid">
				<!-- 9 cells -->
				<div class="ttt-cell" data-index="0"></div>
				<div class="ttt-cell" data-index="1"></div>
				<div class="ttt-cell" data-index="2"></div>
				<div class="ttt-cell" data-index="3"></div>
				<div class="ttt-cell" data-index="4"></div>
				<div class="ttt-cell" data-index="5"></div>
				<div class="ttt-cell" data-index="6"></div>
				<div class="ttt-cell" data-index="7"></div>
				<div class="ttt-cell" data-index="8"></div>
			</div>
			<div class="controls" style="margin-top:12px;">
				<label>
					<input type="checkbox" id="ttt-mode-toggle"> 2 Player Mode
				</label>
				<label>
					<input type="checkbox" id="ttt-quantum-toggle"> Quantum Mode
				</label>
				<button id="ttt-reset" class="secondary" style="margin-left:20px;">Reset</button>
				<div id="ttt-status" style="margin-left:12px;"></div>
			</div>
		</section>
	</main>

	<footer class="site-footer"><div class="container">©The Nexus Hub </div></footer>

	<script src="JS/tictactoe.js"></script>
	<script src="../script.js"></script>
</body>
</html>
